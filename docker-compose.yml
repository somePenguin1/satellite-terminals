# Full platform on one machine:  docker compose up --build
#   UI            http://localhost:3000
#   Fleet API     http://localhost:8080/swagger-ui.html
#   Ingest        gRPC localhost:9090, metrics http://localhost:8081/metrics
name: satfleet

x-ingest-env: &db-url postgres://fleet:fleet@postgres:5432/fleet?sslmode=disable

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fleet
      POSTGRES_PASSWORD: fleet
      POSTGRES_DB: fleet
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_wal_size=2GB", "-c", "max_connections=200"]
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleet -d fleet"]
      interval: 3s
      timeout: 3s
      retries: 20

  # Owns the schema: Flyway migrations run on startup, so the other services wait for it.
  fleet-api:
    build: services/fleet-api
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/fleet
      SPRING_DATASOURCE_USERNAME: fleet
      SPRING_DATASOURCE_PASSWORD: fleet
      FLEET_CORS_ORIGINS: http://localhost:5173
    ports: ["8080:8080"]
    depends_on:
      postgres: { condition: service_healthy }

  ingest:
    build: { context: services/ingest, target: ingest }
    environment:
      DATABASE_URL: *db-url
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    ports: ["9090:9090", "8081:8081"]
    depends_on:
      fleet-api: { condition: service_healthy }

  web:
    build: web
    ports: ["3000:8080"]
    depends_on:
      fleet-api: { condition: service_healthy }
      ingest: { condition: service_healthy }

  # ~4,750 simulated terminals mirrored from the fleet API, streaming over gRPC.
  # SAT-00001 and SAT-00002 are left to the real C agents below.
  simulator:
    build: { context: services/ingest, target: simulator }
    command: ["-target", "ingest:9090", "-api", "http://fleet-api:8080", "-exclude", "1-2", "-streams", "8"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      ingest: { condition: service_healthy }

  agent-1:
    build: agent
    command: ["--id", "SAT-00001", "--ingest", "ws://ingest:8081/ws/ingest", "--api", "http://fleet-api:8080"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      ingest: { condition: service_healthy }

  agent-2:
    build: agent
    command: ["--id", "SAT-00002", "--ingest", "ws://ingest:8081/ws/ingest", "--api", "http://fleet-api:8080"]
    environment:
      INGEST_TOKEN: ${INGEST_TOKEN:-}
    depends_on:
      ingest: { condition: service_healthy }

volumes:
  pgdata:
