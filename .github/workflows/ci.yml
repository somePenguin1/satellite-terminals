name: CI

# Every pull request runs unit, integration and end-to-end tests for every component,
# plus a load test that fails the build if sustained ingest drops below 5,000 reports/s.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  agent:
    name: C agent
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: make test
      - name: Unit tests under AddressSanitizer + UBSan
        run: make asan
      - name: Static analysis
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq cppcheck
          cppcheck --error-exitcode=1 --enable=warning,performance,portability --inline-suppr -q --std=c11 src
      - name: Static release binary
        run: make static && ls -l build/satfleet-agent

  ingest:
    name: Go ingest
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fleet
          POSTGRES_PASSWORD: fleet
          POSTGRES_DB: fleet_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fleet -d fleet_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: services/ingest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: services/ingest/go.mod
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Regenerate protobuf code with pinned generators
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq protobuf-compiler
          go install google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.11
          go install google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.5.1
          cd ../.. && protoc -I proto \
            --go_out=services/ingest --go_opt=module=satfleet/ingest \
            --go-grpc_out=services/ingest --go-grpc_opt=module=satfleet/ingest \
            proto/fleet/telemetry/v1/telemetry.proto
      - name: Vet
        run: go vet ./... && go vet -tags=integration ./...
      - name: Staticcheck
        run: go run honnef.co/go/tools/cmd/staticcheck@2025.1.1 ./...
      - name: Unit tests (race detector)
        run: go test -race -count=1 -coverprofile=coverage.out ./...
      - name: Integration tests against Postgres
        env:
          TEST_DATABASE_URL: postgres://fleet:fleet@localhost:5432/fleet_test?sslmode=disable
        run: go test -tags=integration -count=1 -v ./internal/store/...
      - name: Upload generated and module files
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: go-generated
          path: |
            services/ingest/go.mod
            services/ingest/go.sum
            services/ingest/internal/gen/
      - name: Generated code and go.sum must be committed
        run: |
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)" || { echo "::error::Run 'go mod tidy' and 'make proto' and commit the result"; git diff --stat -- .; exit 1; }

  fleet-api:
    name: Java fleet API
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/fleet-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Unit + integration tests (Testcontainers Postgres)
        run: mvn -B -ntp verify
      - name: Test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fleet-api-test-reports
          path: |
            services/fleet-api/target/surefire-reports/
            services/fleet-api/target/failsafe-reports/

  web:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: Type check
        run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  e2e:
    name: End-to-end + load test
    needs: [agent, ingest, fleet-api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build and start the full stack
        run: docker compose up --build --detach --wait --wait-timeout 300
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright
        working-directory: e2e
        run: npm ci --no-audit --no-fund && npx playwright install --with-deps chromium
      - name: Browser and API end-to-end tests
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:3000
        run: npx playwright test
      - name: Load test (fails below 5,000 persisted reports/s)
        run: |
          docker compose run --rm --no-deps --entrypoint /loadtest simulator \
            -target ingest:9090 -metrics http://ingest:8081/metrics \
            -rate 6000 -streams 16 -duration 60s -min-rate 5000 -json - > loadtest.json
          cat loadtest.json
          {
            echo "### Ingest load test"
            echo '```json'
            cat loadtest.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 300
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-results
          path: |
            e2e/playwright-report/
            e2e/test-results/
            loadtest.json
      - name: Stop stack
        if: always()
        run: docker compose down -v
