apiVersion: v1
kind: Service
metadata:
  name: ingest
spec:
  selector: { app: ingest }
  ports:
    - name: grpc
      port: 9090
      appProtocol: grpc
    - name: http
      port: 8081
---
# Headless service: gRPC streams are long-lived HTTP/2 connections, so a ClusterIP would pin
# each client to one pod. Clients resolve dns:///ingest-headless:9090 and balance per stream.
apiVersion: v1
kind: Service
metadata:
  name: ingest-headless
spec:
  clusterIP: None
  selector: { app: ingest }
  ports:
    - name: grpc
      port: 9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
spec:
  replicas: 2
  selector:
    matchLabels: { app: ingest }
  template:
    metadata:
      labels: { app: ingest }
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8081"
    spec:
      terminationGracePeriodSeconds: 40 # drain streams and flush queued batches
      containers:
        - name: ingest
          image: satfleet/ingest
          ports:
            - containerPort: 9090
            - containerPort: 8081
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: postgres-credentials, key: DATABASE_URL } }
          readinessProbe:
            httpGet: { path: /readyz, port: 8081 }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: 8081 }
            periodSeconds: 10
          resources:
            requests: { cpu: 250m, memory: 128Mi }
            limits: { memory: 512Mi }
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: ingest
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: ingest }
  minReplicas: 2
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: ingest
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: ingest }
