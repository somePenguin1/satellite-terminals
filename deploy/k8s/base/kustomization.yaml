apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: satfleet
labels:
  - pairs:
      app.kubernetes.io/part-of: satfleet
    includeSelectors: false
resources:
  - namespace.yaml
  - postgres.yaml
  - fleet-api.yaml
  - ingest.yaml
  - web.yaml
  - simulator.yaml
  - agents.yaml
images:
  - name: satfleet/fleet-api
    newTag: latest
  - name: satfleet/ingest
    newTag: latest
  - name: satfleet/simulator
    newTag: latest
  - name: satfleet/web
    newTag: latest
  - name: satfleet/agent
    newTag: latest
